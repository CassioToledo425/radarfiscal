name: Atualizar Radar Fiscal

on:
  push:
    branches: ['main']
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  schedule:
    # 09h, 13h e 18h no horário de Brasília (UTC-3), de segunda a sexta.
    - cron: '0 12,16,21 * * 1-5'
    # Uma coleta aos fins de semana para capturar comunicados extraordinários.
    - cron: '0 15 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-fiscal-data
  cancel-in-progress: true

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar coletores
        run: python -m py_compile scripts/fetch_agenda.py scripts/fetch_news.py scripts/fetch_split_payment.py

      - name: Atualizar agenda tributária
        run: python scripts/fetch_agenda.py

      - name: Atualizar notícias e fontes
        run: python scripts/fetch_news.py

      - name: Atualizar Split Payment
        run: python scripts/fetch_split_payment.py

      - name: Salvar dados no repositório
        run: |
          if git diff --quiet -- data; then
            echo "Nenhuma alteração de dados."
          else
            git config user.name "radar-fiscal-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: atualiza radar fiscal"
            git push
          fi

      # O push feito pelo GITHUB_TOKEN não dispara outro workflow por segurança.
      # Por isso a publicação do Pages acontece nesta mesma execução.
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar site para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar Radar Fiscal
        id: deployment
        uses: actions/deploy-pages@v4
